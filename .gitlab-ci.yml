stages:
  - lint
  - build

include:
  - project: 'PassiveLogic/ci'
    ref: release/v4
    file:
      - '/templates/rules.yml'
      - '/templates/common.yml'
  - component: gitlab.com/PassiveLogic/ci/commitlint@4
    inputs:
      job-stage: lint

build:
  interruptible: true
  stage: build
  image: registry.gitlab.com/passivelogic/compiler/swift/swift-ci:latest
  tags:
    - passivelogic-linux-large-arm64  # 4 hr
    # - passivelogic-linux-medium-arm64 # > 3 hr (timeout from runner)
    # - passivelogic-compiler-orin      # > 6 hr (timeout from project)

  before_script:
    - swift --version
    - !reference [.unsafe-global-git-config-https-override, before_script]

  script:
    - YEAR=$(date +"%Y")
    - MONTH=$(date +"%m")
    - DAY=$(date +"%d")
    - TOOLCHAIN_NAME=swift+ptx-${YEAR}-${MONTH}-${DAY}
    - TOOLCHAIN_ARCH=${CI_RUNNER_EXECUTABLE_ARCH//\//-}
    - ARCHIVE=${TOOLCHAIN_NAME}-${TOOLCHAIN_ARCH}.tar.gz
    - SWIFT_TAG=$(basename ${CI_COMMIT_BRANCH})

    - git clone --single-branch --branch ${CI_COMMIT_BRANCH} git@gitlab.com:PassiveLogic/compiler/swift-corelibs-foundation.git ../swift-corelibs-foundation
    - ./utils/update-checkout --clone --tag ${SWIFT_TAG} --skip-repository swift --skip-repository swift-corelibs-foundation
    - ./utils/build-script --preset=buildbot_linux,gpu,no_test install_destdir=${PWD}/../build/buildbot_linux/toolkit-${TOOLCHAIN_ARCH} installable_package=${PWD}/${ARCHIVE} |& tee build.log

  cache:
    key: cache-$CI_COMMIT_BRANCH
    paths:
      - ../build

  artifacts:
    when: always
    paths:
      - build.log
      - swift+ptx*.tar.gz

